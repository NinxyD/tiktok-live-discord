name: TikTok LIVE a Discord

on:
  schedule:
    - cron: "*/5 * * * *"  # Respaldo por si acaso

  workflow_dispatch:
    inputs:
      test_discord:
        description: "Enviar un mensaje de prueba a Discord"
        required: false
        default: false
        type: boolean

  repository_dispatch:
    types: [run-tiktok-check]

permissions:
  contents: write

concurrency:
  group: tiktok-live-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar archivos
        run: |
          pwd
          ls -la
          test -f monitor.py || {
            echo "::error::No se encuentra monitor.py en la raíz."
            exit 1
          }

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip TikTokLive requests

      - name: Comprobar directo y notificar
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEST_DISCORD: ${{ inputs.test_discord }}
        run: python -u ./monitor.py

      - name: Guardar estado
        if: success() && inputs.test_discord != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_state.json

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar estado de TikTok LIVE"
            git push origin HEAD:main
          else
            echo "No hubo cambios de estado."
          fi
