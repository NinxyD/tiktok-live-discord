name: TikTok LIVE a Discord

on:
  schedule:
    - cron: "4-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiktok-live-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar archivos del repositorio
        run: |
          echo "Rama actual:"
          git branch --show-current

          echo "Directorio de trabajo:"
          pwd

          echo "Contenido de la raíz:"
          ls -la

          echo "Archivos monitor.py encontrados:"
          find . -type f -name "monitor.py" \
            -not -path "./.git/*"

          if [ ! -f "./monitor.py" ]; then
            echo "::error::No existe monitor.py en la raíz de la rama main."
            echo "Archivos registrados en Git:"
            git ls-tree -r --name-only HEAD
            exit 1
          fi

          echo "monitor.py encontrado correctamente."

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip TikTokLive

      - name: Comprobar directo y notificar
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python -u ./monitor.py

      - name: Guardar estado para la siguiente comprobación
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live_state.json

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar estado de TikTok LIVE"
            git push origin HEAD:main
          else
            echo "No hubo cambios de estado."
          fi
